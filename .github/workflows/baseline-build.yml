# Baseline G1: bangun source Zangetsu-main.zip APA ADANYA (tanpa mengubah satu baris pun).
# Resep mengikuti CI referensi: Java 17 (Temurin), Flutter 3.44.7 stable, ZANGETSU_NO_DISCORD=1,
# tanpa google-services.json. Tidak ada rahasia/kunci di berkas ini.
name: Baseline build

on:
  workflow_dispatch:
    inputs:
      mode:
        description: "Jenis APK"
        type: choice
        options: [debug, release]
        default: debug
      pasang_berdampingan:
        description: "Pasang berdampingan (package .nightly, tidak menimpa Zangetsu asli)"
        type: boolean
        default: true
      memori_rendah:
        description: "Kurangi memori Gradle (coba bila gagal kehabisan memori)"
        type: boolean
        default: false
  push:
    paths:
      - "*.zip"

concurrency:
  group: baseline-build
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    env:
      MODE: ${{ inputs.mode || 'debug' }}
    steps:
      - uses: actions/checkout@v4

      - name: Siapkan Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Siapkan Flutter 3.44.7
        uses: subosito/flutter-action@v2
        with:
          flutter-version: "3.44.7"
          channel: stable
          cache: true

      - name: Ekstrak ZIP
        run: |
          set -e
          ZIPFILE=$(ls -1 *.zip 2>/dev/null | head -n 1)
          test -n "$ZIPFILE" || { echo "Tidak ada berkas .zip di root repo"; exit 1; }
          echo "ZIP: $ZIPFILE"
          rm -rf src && mkdir src
          unzip -q "$ZIPFILE" -d src
          PUB=$(find src -maxdepth 3 -name pubspec.yaml | head -n 1)
          test -n "$PUB" || { echo "pubspec.yaml tidak ditemukan di dalam ZIP"; exit 1; }
          ROOT=$(dirname "$PUB")
          echo "ROOT=$ROOT" >> "$GITHUB_ENV"
          echo "Proyek ada di: $ROOT"
          grep -m1 '^version:' "$ROOT/pubspec.yaml"

      - name: Atur memori Gradle (opsional)
        if: ${{ inputs.memori_rendah }}
        run: |
          mkdir -p ~/.gradle
          echo "org.gradle.jvmargs=-Xmx5G -XX:MaxMetaspaceSize=2G -XX:ReservedCodeCacheSize=512m" >> ~/.gradle/gradle.properties

      - name: Ambil dependensi
        working-directory: ${{ env.ROOT }}
        run: |
          set -o pipefail
          flutter pub get 2>&1 | tee -a "$GITHUB_WORKSPACE/build.log"

      - name: Bangun APK arm64
        working-directory: ${{ env.ROOT }}
        env:
          ZANGETSU_NO_DISCORD: "1"
          ZANGETSU_NIGHTLY: ${{ (github.event_name != 'workflow_dispatch' || inputs.pasang_berdampingan) && '1' || '' }}
        run: |
          set -o pipefail
          flutter build apk --${MODE} --target-platform android-arm64 2>&1 | tee -a "$GITHUB_WORKSPACE/build.log"

      - name: Catatan build
        run: |
          APK="$ROOT/build/app/outputs/flutter-apk/app-${MODE}.apk"
          ls -l "$APK"
          {
            echo "## Build berhasil"
            echo
            echo "- Waktu (UTC): $(date -u +%Y-%m-%dT%H:%M:%SZ)"
            echo "- Jenis: $MODE (arm64)"
            echo "- Ukuran: $(du -h "$APK" | cut -f1)"
            echo "- SHA-256: $(sha256sum "$APK" | cut -d' ' -f1)"
            echo "- Commit: $GITHUB_SHA"
            echo "- $(flutter --version | head -n 1)"
            echo "- $(java -version 2>&1 | head -n 1)"
            echo "- Perintah: flutter build apk --$MODE --target-platform android-arm64"
            echo "- Penanda tangan: kunci debug bawaan (belum kunci Ram)"
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Unggah APK
        uses: actions/upload-artifact@v4
        with:
          name: baseline-${{ env.MODE }}-arm64
          path: ${{ env.ROOT }}/build/app/outputs/flutter-apk/app-${{ env.MODE }}.apk
          if-no-files-found: error
          retention-days: 14

      - name: Ringkasan galat
        if: ${{ failure() }}
        run: |
          {
            echo "## Build GAGAL. Salin blok di bawah lalu tempel ke Claude."
            echo
            echo '```'
            tail -n 120 build.log 2>/dev/null || echo "(build.log belum ada: gagal sebelum tahap dependensi, lihat langkah yang berwarna merah)"
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Unggah log
        if: ${{ always() }}
        uses: actions/upload-artifact@v4
        with:
          name: build-log
          path: build.log
          if-no-files-found: ignore
          retention-days: 7
