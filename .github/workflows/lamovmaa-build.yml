# Build Lamovmaa (hasil rebrand PART 9) lewat GitHub Actions.
# Resep sama dengan baseline G1: Java 17 (Temurin), Flutter 3.44.7 stable, ZANGETSU_NO_DISCORD=1,
# tanpa google-services.json. Tidak ada rahasia/kunci di berkas ini (keystore menyusul di PART berikutnya).
# Berkas ZIP wajib bernama Lamovmaa-main.zip di root repo.
# Hanya dijalankan manual (Run workflow); unggah ZIP tidak memicu build otomatis. Run kedua akan menunggu, tidak membatalkan run pertama.
name: Build Lamovmaa

on:
  workflow_dispatch:
    inputs:
      mode:
        description: "Jenis APK"
        type: choice
        options: [debug, release]
        default: debug
      memori_rendah:
        description: "Kurangi memori Gradle (coba bila gagal kehabisan memori)"
        type: boolean
        default: false

concurrency:
  group: build-lamovmaa
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    env:
      MODE: ${{ inputs.mode || 'debug' }}
    steps:
      - uses: actions/checkout@v4

      - name: Siapkan Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Siapkan Flutter 3.44.7
        uses: subosito/flutter-action@v2
        with:
          flutter-version: "3.44.7"
          channel: stable
          cache: true

      - name: Ekstrak ZIP
        run: |
          set -e
          test -f Lamovmaa-main.zip || { echo "Lamovmaa-main.zip tidak ada di root repo"; exit 1; }
          rm -rf src && mkdir src
          unzip -q Lamovmaa-main.zip -d src
          PUB=$(find src -maxdepth 3 -name pubspec.yaml | head -n 1)
          test -n "$PUB" || { echo "pubspec.yaml tidak ditemukan di dalam ZIP"; exit 1; }
          ROOT=$(dirname "$PUB")
          echo "ROOT=$ROOT" >> "$GITHUB_ENV"
          echo "Proyek ada di: $ROOT"
          grep -m1 '^version:' "$ROOT/pubspec.yaml"

      - name: Periksa sisa nama lama
        run: |
          if grep -rIl --include='*.kt' --include='*.dart' --include='*.kts' --include='*.xml' --include='*.cpp' "com\.spyou\|com_spyou" "$ROOT/android" "$ROOT/lib" "$ROOT/test"; then
            echo "Masih ada rujukan package lama (com.spyou) pada berkas di atas."; exit 1
          fi
          echo "Tidak ada sisa package lama."

      - name: Atur memori Gradle (opsional)
        if: ${{ inputs.memori_rendah }}
        run: |
          mkdir -p ~/.gradle
          echo "org.gradle.jvmargs=-Xmx5G -XX:MaxMetaspaceSize=2G -XX:ReservedCodeCacheSize=512m" >> ~/.gradle/gradle.properties

      - name: Ambil dependensi
        working-directory: ${{ env.ROOT }}
        run: |
          set -o pipefail
          flutter pub get 2>&1 | tee -a "$GITHUB_WORKSPACE/build.log"

      - name: Bangun APK arm64
        working-directory: ${{ env.ROOT }}
        env:
          ZANGETSU_NO_DISCORD: "1"
        run: |
          set -o pipefail
          flutter build apk --${MODE} --target-platform android-arm64 2>&1 | tee -a "$GITHUB_WORKSPACE/build.log"

      - name: Verifikasi identitas APK
        run: |
          APK="$ROOT/build/app/outputs/flutter-apk/app-${MODE}.apk"
          AAPT=$(ls -d "${ANDROID_HOME:-/usr/local/lib/android/sdk}"/build-tools/*/aapt2 2>/dev/null | sort -V | tail -n 1)
          {
            echo "## Identitas APK"
            if [ -n "$AAPT" ]; then
              BADGE=$("$AAPT" dump badging "$APK" 2>/dev/null | head -n 40)
              echo '```'
              echo "$BADGE" | grep -E "^package:|^application-label:|^sdkVersion|^targetSdkVersion|native-code" || true
              echo '```'
              echo "$BADGE" | grep -q "name='com.lamovmaa.app'" || { echo "PACKAGE TIDAK SESUAI (harus com.lamovmaa.app)"; exit 1; }
            else
              echo "aapt2 tidak ditemukan di runner; verifikasi package dilewati."
            fi
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Catatan build
        run: |
          APK="$ROOT/build/app/outputs/flutter-apk/app-${MODE}.apk"
          {
            echo "## Build berhasil"
            echo
            echo "- Waktu (UTC): $(date -u +%Y-%m-%dT%H:%M:%SZ)"
            echo "- Jenis: $MODE (arm64)"
            echo "- Ukuran: $(du -h "$APK" | cut -f1)"
            echo "- SHA-256: $(sha256sum "$APK" | cut -d' ' -f1)"
            echo "- Commit: $GITHUB_SHA"
            echo "- $(flutter --version | head -n 1)"
            echo "- $(java -version 2>&1 | head -n 1)"
            echo "- Perintah: flutter build apk --$MODE --target-platform android-arm64"
            echo "- Penanda tangan: kunci debug bawaan (belum kunci Ram)"
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Unggah APK
        uses: actions/upload-artifact@v4
        with:
          name: lamovmaa-${{ env.MODE }}-arm64
          path: ${{ env.ROOT }}/build/app/outputs/flutter-apk/app-${{ env.MODE }}.apk
          if-no-files-found: error
          retention-days: 14

      - name: Ringkasan galat
        if: ${{ failure() }}
        run: |
          {
            echo "## Build GAGAL. Salin blok di bawah lalu tempel ke Claude."
            echo
            echo '```'
            tail -n 120 build.log 2>/dev/null || echo "(build.log belum ada: gagal sebelum tahap dependensi, lihat langkah yang berwarna merah)"
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Unggah log
        if: ${{ always() }}
        uses: actions/upload-artifact@v4
        with:
          name: build-log
          path: build.log
          if-no-files-found: ignore
          retention-days: 7
